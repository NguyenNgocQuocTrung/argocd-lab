
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jenkins-ci-demo
  namespace: jenkins-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: jenkins-ci-demo
  template:
    metadata:
      labels:
        app: jenkins-ci-demo
    spec:
      containers:
        - name: app
          image: goodboynhatrang/jenkins-ci-demo:899144b0413d65edd302fc193bc978163f063616
          ports:
            - name: http
              containerPort: 5000
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 10
