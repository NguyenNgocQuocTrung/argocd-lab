
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jenkins-ci-demo
  namespace: jenkins-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: jenkins-ci-demo
  template:
    metadata:
      labels:
        app: jenkins-ci-demo
    spec:
      containers:
        - name: app
          image: goodboynhatrang/jenkins-ci-demo:71e5d2c325aac72fb924095b0f88e5d55772f210
          ports:
            - name: http
              containerPort: 5000
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 10
